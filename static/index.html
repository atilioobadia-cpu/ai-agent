<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Workspace - Execution Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            terminal: '#090d16',
            panel: '#111827'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0b0f19] text-slate-100 flex h-screen font-mono text-xs antialiased overflow-hidden">

  <aside class="w-72 bg-panel border-r border-slate-800 flex flex-col p-4 shrink-0 overflow-y-auto gap-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center gap-2">
        <div id="coreDot" class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="font-bold text-sm tracking-wider text-slate-200">AGENT_CORE</span>
      </div>
      <span id="statePill" class="px-2 py-0.5 text-[10px] bg-slate-800 text-slate-400 rounded">IDLE</span>
    </div>

    <div class="space-y-2">
      <label class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Target Workspace</label>
      <div id="workspaceBox" class="bg-slate-900 border border-slate-800 p-2.5 rounded font-mono text-slate-300 truncate" title="">...</div>
    </div>

    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <label class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Executive Sessions</label>
        <span id="sessionCount" class="text-[10px] text-slate-600">0</span>
      </div>
      <div id="sessionList" class="space-y-1.5 max-h-64 overflow-y-auto pr-1"></div>
    </div>

    <div class="space-y-3">
      <label class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Resource Telemetry</label>

      <div class="bg-slate-900/60 p-2.5 rounded border border-slate-800 space-y-2">
        <div class="flex justify-between text-slate-400">
          <span>Tokens Total</span>
          <span id="tokenCount" class="text-indigo-400">0</span>
        </div>
        <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden">
          <div id="tokenBar" class="bg-indigo-500 h-full transition-all" style="width: 0%"></div>
        </div>
      </div>

      <div class="bg-slate-900/60 p-2.5 rounded border border-slate-800 space-y-2">
        <div class="flex justify-between text-slate-400">
          <span>Tool Calls Executed</span>
          <span id="toolCount" class="text-emerald-400">0</span>
        </div>
        <div class="flex justify-between text-slate-400">
          <span>Engine</span>
          <span id="engineName" class="text-slate-200 truncate ml-2">...</span>
        </div>
        <div class="flex justify-between text-slate-400">
          <span>Status</span>
          <span class="text-emerald-400 flex items-center gap-1"><span class="h-1.5 w-1.5 bg-emerald-400 rounded-full"></span> Connected</span>
        </div>
      </div>
    </div>

    <div class="mt-auto space-y-3 pt-4">
      <button id="newSessionBtn" class="w-full px-3 py-2 rounded-md border border-slate-700 text-slate-300 hover:bg-slate-800 text-xs font-medium transition-colors">+ Focus Input For Next Goal</button>
      <div id="securityRow" class="bg-amber-500/10 border border-amber-500/20 p-3 rounded text-amber-400 flex items-center justify-between">
        <span id="securityLabel">Require Approval</span>
        <input id="approvalToggle" type="checkbox" checked class="accent-amber-500 rounded cursor-pointer" />
      </div>
    </div>
  </aside>

  <main class="flex-1 flex flex-col h-full bg-[#0b0f19] min-w-0">

    <header class="h-12 border-b border-slate-800 px-6 flex items-center justify-between bg-slate-900/40 shrink-0 gap-4">
      <div class="flex items-center gap-3 text-slate-400 min-w-0">
        <span class="text-slate-200 font-semibold shrink-0">Active Task:</span>
        <span id="activeTask" class="text-indigo-400 truncate max-w-xs md:max-w-sm lg:max-w-md">none</span>
      </div>
      <div class="flex gap-2 shrink-0">
        <button id="abortBtn" class="px-3 py-1 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded hover:bg-rose-500/30 transition-colors disabled:opacity-40" disabled>Abort Process</button>
        <button id="exportBtn" class="px-3 py-1 bg-slate-800 text-slate-300 border border-slate-700 rounded hover:bg-slate-700 transition-colors">Export History</button>
      </div>
    </header>

    <div id="feed" class="flex-1 flex-col overflow-y-auto p-6 space-y-4"></div>

    <div class="p-4 border-t border-slate-800 bg-slate-900/50 shrink-0">
      <form id="form" class="max-w-5xl mx-auto flex gap-3">
        <input id="input" type="text" autocomplete="off"
          placeholder="Assign a goal to the agent..."
          class="flex-1 min-w-0 bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors" />
        <button id="send" type="submit"
          class="shrink-0 px-6 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-xs transition-colors shadow-lg shadow-indigo-500/20 disabled:opacity-50">
          Execute Goal
        </button>
      </form>
    </div>

  </main>

<script>
const feedEl = document.getElementById('feed');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const abortBtn = document.getElementById('abortBtn');
const CONTEXT_LIMIT = 131072;

const PROMPT_CHIPS = [
  'Inventory my Downloads folder by file type',
  'What is on my Desktop right now?',
  'Fetch example.com and summarize what it is',
  'Write hello.txt into the workspace with a greeting'
];

const TOOL_TITLES = {
  run_command: 'POWERSHELL EXEC',
  list_files: 'LIST FILES',
  read_file: 'READ FILE',
  write_file: 'WRITE FILE',
  fetch_url: 'FETCH URL'
};

let sessions = [];
let activeId = null;
let busy = false;
let pendingApproval = null;

function el(tag, classes, text) {
  const node = document.createElement(tag);
  if (classes) node.className = classes;
  if (text !== undefined) node.textContent = text;
  return node;
}

function scrollBottom() { feedEl.scrollTop = feedEl.scrollHeight; }

function setStatus(state) {
  const pill = document.getElementById('statePill');
  const dot = document.getElementById('coreDot');
  pill.textContent = state;
  pill.className = 'px-2 py-0.5 text-[10px] rounded ' +
    (state === 'RUNNING' ? 'bg-indigo-500/20 text-indigo-300' : 'bg-slate-800 text-slate-400');
  dot.className = 'h-3 w-3 rounded-full animate-pulse ' +
    (state === 'RUNNING' ? 'bg-indigo-500' : 'bg-emerald-500');
}

function byId(id) { return sessions.find(s => s.id === id); }
function activeSession() { return byId(activeId); }

async function loadProviderInfo() {
  try {
    const res = await fetch('/api/provider');
    const info = await res.json();
    document.getElementById('engineName').textContent = info.model.split('/').pop();
    document.getElementById('workspaceBox').textContent = info.workspace;
    document.getElementById('workspaceBox').title = info.allowed_paths;
    const toggle = document.getElementById('approvalToggle');
    toggle.checked = info.approvals_required;
    paintSecurityRow(info.approvals_required);
  } catch (e) {}
}

function paintSecurityRow(required) {
  const row = document.getElementById('securityRow');
  document.getElementById('securityLabel').textContent =
    required ? 'Require Approval' : 'Autonomous Mode';
  row.className = required
    ? 'bg-amber-500/10 border border-amber-500/20 p-3 rounded text-amber-400 flex items-center justify-between'
    : 'bg-rose-500/10 border border-rose-500/20 p-3 rounded text-rose-400 flex items-center justify-between';
}

document.getElementById('approvalToggle').addEventListener('change', async (e) => {
  const required = e.target.checked;
  e.target.disabled = true;
  try {
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ require_approval: required })
    });
    const data = await res.json();
    paintSecurityRow(data.approvals_required);
  } catch (err) {
    e.target.checked = !required;
  } finally {
    e.target.disabled = false;
  }
});

function fmtArgs(ev) {
  if (ev.tool === 'run_command' && ev.args && ev.args.command) return String(ev.args.command);
  try { return JSON.stringify(ev.args, null, 2); } catch (e) { return String(ev.args); }
}

function exitChip(ev) {
  if (ev.denied) return el('span', 'text-amber-400 text-[10px] bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded', 'DENIED');
  if (!ev.ok) return el('span', 'text-rose-400 text-[10px] bg-rose-500/10 border border-rose-500/20 px-2 py-0.5 rounded', 'BLOCKED');
  const match = String(ev.output || '').match(/^exit code:\s*(\d+)/i);
  const code = ev.tool === 'run_command' && match ? match[1] : null;
  if (code === null) return el('span', 'text-emerald-400 text-[10px] bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded', 'OK');
  const okExit = code === '0';
  return el('span',
    'text-[10px] px-2 py-0.5 rounded border ' +
    (okExit ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20'),
    'EXIT ' + code);
}

function buildToolCard(ev, stepNumber) {
  const card = el('div', 'border border-slate-800 rounded-lg bg-terminal overflow-hidden');

  const head = el('div', 'bg-slate-900/90 px-4 py-2 border-b border-slate-800 flex justify-between items-center text-slate-400 gap-2');
  const label = el('span', 'font-mono text-[11px] flex items-center gap-2 min-w-0');
  label.append(el('span', 'h-2 w-2 rounded-full shrink-0 ' +
    (ev.denied ? 'bg-amber-400' : (ev.ok ? 'bg-emerald-500' : 'bg-rose-500'))));
  label.append(el('span', 'truncate', `STEP ${stepNumber}: ${TOOL_TITLES[ev.tool] || ev.tool}`));
  head.append(label);
  const right = el('span', 'flex items-center gap-2 shrink-0');
  right.append(exitChip(ev));
  right.append(el('span', 'text-slate-500 text-[10px]', `${ev.duration_ms}ms`));
  head.append(right);
  card.append(head);

  const body = el('div', 'p-4 font-mono text-slate-300 space-y-2 overflow-x-auto text-xs');
  body.append(el('div', 'text-slate-500 break-all whitespace-pre-wrap', '> ' + fmtArgs(ev)));
  const colorCls = ev.denied ? 'text-amber-300' : (ev.ok ? 'text-emerald-300' : 'text-rose-300');
  const fullText = String(ev.output || '').replace(/^exit code:\s*\d+\s*/i, '').trim() || '(empty output)';
  if (fullText.length > 240) {
    const details = el('details', '');
    const summary = el('summary',
      'cursor-pointer text-slate-500 hover:text-slate-300 select-none py-1 text-[11px]',
      `inline preview hidden - large output (${fullText.length} chars), click to expand`);
    details.append(summary);
    details.append(el('div', 'mt-2 p-2 rounded bg-black/40 whitespace-pre-wrap break-all ' + colorCls, fullText));
    body.append(details);
  } else {
    body.append(el('div', 'pl-4 whitespace-pre-wrap break-all ' + colorCls, fullText));
  }
  card.append(body);
  return card;
}

function buildNoteCard(text) {
  const card = el('div', 'border-l-2 border-indigo-500 bg-slate-900/50 rounded-r-lg p-4 space-y-2');
  card.append(el('div', 'text-indigo-400 font-semibold text-[11px] tracking-wider', 'AGENT NOTE'));
  card.append(el('div', 'text-slate-300 whitespace-pre-wrap leading-relaxed font-mono', text));
  return card;
}

function buildGateCard(toolCall, sessionId) {
  const card = el('div', 'border border-amber-500/30 rounded-lg bg-amber-500/5 p-4 space-y-3');

  const head = el('div', 'flex items-center gap-2 text-amber-400 font-semibold text-[11px] tracking-wider');
  head.append(el('span', 'h-2 w-2 rounded-full bg-amber-400 animate-bounce'));
  head.append(el('span', '', `ACTION REQUIRED: ${TOOL_TITLES[toolCall.name] || toolCall.name} NEEDS APPROVAL`));
  card.append(head);

  let argText;
  try { argText = JSON.stringify(JSON.parse(toolCall.arguments || '{}'), null, 2); }
  catch (e) { argText = toolCall.arguments || ''; }
  card.append(el('div', 'bg-terminal border border-slate-800 p-2.5 rounded text-amber-200 whitespace-pre-wrap break-all', argText));

  const buttons = el('div', 'flex gap-3 pt-1');
  const allowBtn = el('button', 'px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-semibold text-xs transition', 'Approve Execution');
  const denyBtn = el('button', 'px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-semibold text-xs transition', 'Deny & Skip Step');
  allowBtn.onclick = () => respond(true, card);
  denyBtn.onclick = () => respond(false, card);
  buttons.append(allowBtn, denyBtn);
  card.append(buttons);
  return card;
}

function buildResultPanel(reply, isError) {
  const card = el('div', 'rounded-lg p-3.5 space-y-1 border ' +
    (isError ? 'border-rose-500/20 bg-rose-950/30' : 'border-indigo-500/20 bg-indigo-950/30'));
  card.append(el('div', 'block font-bold uppercase mb-1 text-[10px] tracking-wider ' +
    (isError ? 'text-rose-400' : 'text-indigo-400'), isError ? 'Task Failed' : 'Task Summary'));
  card.append(el('div', 'text-slate-200 whitespace-pre-wrap leading-relaxed', reply));
  return card;
}

function buildTaskCard(s) {
  const card = el('div',
    'border border-slate-800/80 rounded-xl bg-slate-900/40 p-5 space-y-4 shadow-lg' +
    (s.id === activeId ? '' : ' opacity-80'));

  card.dataset.sid = s.id;

  const header = el('div', 'flex items-center justify-between border-b border-slate-800 pb-3 gap-3');
  const goalWrap = el('span', 'text-xs font-bold text-indigo-400 uppercase tracking-wider min-w-0 truncate');
  goalWrap.append(el('span', '', 'GOAL >> '));
  goalWrap.append(el('span', 'text-slate-200 normal-case', s.goal));
  header.append(goalWrap);
  header.append(el('span', 'text-[10px] text-slate-500 shrink-0', s.time));
  card.append(header);

  const steps = el('div', 'space-y-3');
  card.append(steps);

  const resultSlot = el('div', 'space-y-3');
  card.append(resultSlot);

  return card;
}

function refreshTaskCard(s) {
  const card = feedEl.querySelector(`[data-sid="${s.id}"]`);
  if (!card) return;
  const stepsEl = card.children[1];
  const resultEl = card.children[2];
  stepsEl.innerHTML = '';
  resultEl.innerHTML = '';

  let stepNum = 0;
  s.events.forEach(ev => {
    if (ev.type === 'note') {
      stepsEl.append(buildNoteCard(ev.text));
    } else {
      stepNum += 1;
      stepsEl.append(buildToolCard(ev, stepNum));
    }
  });

  if (pendingApproval && pendingApproval.sessionId === s.id) {
    stepsEl.append(buildGateCard(pendingApproval.tool_call, s.id));
  }

  if (s.status === 'awaiting') {
    resultEl.append(el('div', 'text-amber-400 text-[11px] animate-pulse', '> waiting for your decision at the action gate above...'));
  } else if (s.status === 'running') {
    resultEl.append(el('div', 'text-slate-500 text-[11px] animate-pulse', '> agent is working...'));
  } else if (s.status === 'detached') {
    resultEl.append(buildResultPanel('Run was detached by the operator; final output discarded.', true));
  } else if (s.reply !== null) {
    resultEl.append(buildResultPanel(s.reply, s.error));
  }

  updateSidebar();
}

function updateSidebar() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '';
  document.getElementById('sessionCount').textContent = String(sessions.length);

  [...sessions].reverse().forEach(s => {
    const item = el('button',
      'w-full text-left px-2.5 py-2 rounded border flex items-start gap-2 transition-colors ' +
      (s.id === activeId
        ? 'border-indigo-500/40 bg-indigo-500/10'
        : 'border-slate-800 bg-slate-900/40 hover:border-slate-600') +
      (s.status === 'running' || s.status === 'awaiting' ? '' : ' opacity-90'));
    const dotCls =
      s.status === 'awaiting' ? 'bg-amber-400 animate-pulse'
      : s.status === 'running' ? 'bg-indigo-400 animate-pulse'
      : s.status === 'detached' ? 'bg-slate-600'
      : (s.error ? 'bg-rose-500' : 'bg-emerald-500');
    item.append(el('span', `h-2 w-2 rounded-full mt-1 shrink-0 ${dotCls}`));
    const textWrap = el('span', 'min-w-0');
    textWrap.append(el('div', 'truncate text-slate-300', s.goal));
    textWrap.append(el('div', 'text-[10px] text-slate-500', s.time));
    item.append(textWrap);
    item.onclick = () => switchSession(s.id);
    list.append(item);
  });

  let tokens = 0;
  let tools = 0;
  sessions.forEach(s => {
    if (s.usage) tokens += (s.usage.input || 0) + (s.usage.output || 0);
    tools += s.events.filter(e => e.type === 'tool').length;
  });
  document.getElementById('tokenCount').textContent = tokens.toLocaleString();
  document.getElementById('tokenBar').style.width = Math.min(100, (tokens / CONTEXT_LIMIT) * 100).toFixed(1) + '%';
  document.getElementById('toolCount').textContent = `${tools}`;
}

function renderFeed() {
  feedEl.innerHTML = '';
  if (!sessions.length) { showEmptyState(); return; }
  sessions.forEach(s => {
    feedEl.append(buildTaskCard(s));
    refreshTaskCard(s);
  });
  scrollBottom();
}

function switchSession(id) {
  if (busy && id !== activeId) return;
  activeId = id;
  const s = byId(id);
  document.getElementById('activeTask').textContent = s.goal;
  renderFeed();
}

function showEmptyState() {
  const box = el('div', 'h-full flex flex-col items-center justify-center gap-5 text-center py-16');
  box.append(el('div', 'text-6xl font-bold text-slate-800 select-none tracking-widest', '>_'));
  box.append(el('div', 'text-slate-400 text-sm tracking-wide', 'Agent idle. No tasks yet.'));
  box.append(el('div', 'text-slate-600 text-[11px]', 'Assign a goal below or start from a quick task:'));
  const chips = el('div', 'flex flex-wrap justify-center gap-2 max-w-xl');
  PROMPT_CHIPS.forEach(text => {
    const chip = el('button',
      'px-3 py-1.5 rounded-full border border-slate-700 text-slate-300 text-[11px] hover:border-indigo-500 hover:text-indigo-300 hover:bg-indigo-500/10 transition-colors',
      text);
    chip.onclick = () => startGoal(text);
    chips.append(chip);
  });
  box.append(chips);
  feedEl.append(box);
}

async function respond(approved, card) {
  if (!pendingApproval || busy) return;
  const session = byId(pendingApproval.sessionId);
  busy = true;
  setStatus('RUNNING');
  card.querySelectorAll('button').forEach(b => b.remove());
  card.append(el('div', 'mt-1 font-semibold ' + (approved ? 'text-emerald-400' : 'text-amber-400'),
    approved ? '> APPROVED - executing' : '> DENIED - skipping step'));

  const payload = { resume: { state: pendingApproval.state, tool_call: pendingApproval.tool_call, approved } };
  pendingApproval = null;
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    applyResponse(session, await res.json());
  } catch (e) {
    session.status = 'done';
    session.error = true;
    session.reply = 'NETWORK ERROR: is the server running?';
  } finally {
    busy = false;
    setStatus('IDLE');
    abortBtn.disabled = true;
    refreshTaskCard(session);
  }
}

function applyResponse(session, data) {
  if (!session || session.status === 'detached') return;

  if (data.events) session.events = data.events;
  if (data.usage) session.usage = data.usage;

  if (data.status === 'approval_required') {
    session.status = 'awaiting';
    pendingApproval = { sessionId: session.id, state: data.state, tool_call: data.tool_call };
    refreshTaskCard(session);
    scrollBottom();
    return;
  }

  session.status = 'done';
  session.reply = data.reply || '(empty)';
  session.error = !!data.error;
  refreshTaskCard(session);
  scrollBottom();
}

async function startGoal(text) {
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  abortBtn.disabled = false;
  setStatus('RUNNING');

  const s = {
    id: Date.now(),
    goal: text,
    time: new Date().toLocaleTimeString(),
    events: [],
    usage: null,
    reply: null,
    error: false,
    status: 'running'
  };
  sessions.push(s);
  activeId = s.id;
  document.getElementById('activeTask').textContent = text;
  renderFeed();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: [] })
    });
    applyResponse(s, await res.json());
  } catch (e) {
    s.status = 'done';
    s.error = true;
    s.reply = 'NETWORK ERROR: is the server running?';
  } finally {
    busy = false;
    sendBtn.disabled = false;
    abortBtn.disabled = true;
    setStatus('IDLE');
    refreshTaskCard(s);
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  startGoal(text);
});

abortBtn.addEventListener('click', () => {
  const s = activeSession();
  if (!busy || !s) return;
  s.status = 'detached';
  sendBtn.disabled = false;
  abortBtn.disabled = true;
  setStatus('IDLE');
  busy = false;
  refreshTaskCard(s);
});

document.getElementById('newSessionBtn').addEventListener('click', () => {
  if (busy) return;
  input.focus();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  if (!sessions.length) return;
  const exportData = {
    exported_at: new Date().toISOString(),
    engine: document.getElementById('engineName').textContent,
    workspace: document.getElementById('workspaceBox').textContent,
    sessions: sessions.map(s => ({
      goal: s.goal,
      started_at: s.time,
      status: s.status,
      usage: s.usage,
      events: s.events,
      summary: s.reply
    }))
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19);
  link.href = url;
  link.download = `agent-history-${stamp}.json`;
  link.click();
  URL.revokeObjectURL(url);
});

loadProviderInfo();
setStatus('IDLE');
renderFeed();
</script>
</body>
</html>
